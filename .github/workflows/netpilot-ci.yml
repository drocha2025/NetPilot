name: NetPilot CI
# Gives the GitHub Actions workflow a clear name.

on:
  # Runs the workflow when code is pushed to the repository.
  push:
    branches:
      - master

  # Runs the workflow when a pull request targets the master branch.
  pull_request:
    branches:
      - master


jobs:
  test:
    # Gives the CI job a descriptive name.
    name: Python, Security, Secret Scan, and Docker CI

    # Runs the job on a fresh GitHub-hosted Ubuntu system.
    runs-on: ubuntu-latest

    steps:

      # Downloads the NetPilot repository into the CI runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs the Python version used by the CI environment.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Uses Python 3.13 to match the NetPilot Docker image.
          python-version: "3.13"

      # Installs the NetPilot Python dependencies.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Installs pytest because it is required to execute the CI test suite.
      - name: Install pytest
        run: python -m pip install pytest

      # Runs only tests that are designed to execute without live infrastructure.
      - name: Run CI-safe tests
        run: python -m pytest tests/test_ci_smoke.py -q

      # Installs pip-audit so CI can inspect Python dependencies for known vulnerabilities.
      - name: Install pip-audit
        run: python -m pip install pip-audit

      # Runs the dependency security audit.
      # The command is allowed to report known vulnerabilities without failing the pipeline.
      - name: Run dependency security audit
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt

      # Scans the repository for accidentally committed secrets.
      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          # Provides the GitHub token required by the Gitleaks action.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Builds the NetPilot Docker image to verify the application can still be packaged.
      - name: Build NetPilot Docker image
        run: docker build -t netpilot:ci .
